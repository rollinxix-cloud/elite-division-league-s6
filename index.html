<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eLite Division League - Season 6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* eFootball Signature Theme Configuration Engine */
        :root {
            --ef-bg: linear-gradient(135deg, #050b1a 0%, #0a142c 50%, #0f2042 100%);
            --ef-card: rgba(16, 28, 58, 0.75);
            --ef-border: rgba(230, 253, 0, 0.25);
            --ef-text: #f8fafc;
            --ef-text-muted: #94a3b8;
            --ef-neon-yellow: #e6fd00;
            --ef-neon-pink: #ff007f;
            --ef-header-bg: rgba(10, 20, 44, 0.85);
            --ef-table-hover: rgba(230, 253, 0, 0.05);
        }

        [data-theme="light"] {
            --ef-bg: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --ef-card: #ffffff;
            --ef-border: rgba(10, 20, 44, 0.15);
            --ef-text: #0f172a;
            --ef-text-muted: #64748b;
            --ef-neon-yellow: #0052cc; /* Adaptive primary for light view */
            --ef-neon-pink: #d90429;
            --ef-header-bg: #ffffff;
            --ef-table-hover: rgba(0, 82, 204, 0.05);
        }

        body {
            background: var(--ef-bg);
            background-attachment: fixed;
            color: var(--ef-text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .header-banner {
            text-align: center;
            padding: 35px 20px;
            background: var(--ef-header-bg);
            border-bottom: 3px solid var(--ef-neon-pink);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            position: relative;
            transition: background 0.4s ease;
        }

        .league-title {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(to right, #ffffff, var(--ef-neon-yellow), #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }

        /* Theme Toggle Switching Button */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--ef-border);
            color: var(--ef-text);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .theme-toggle-btn:hover {
            background: var(--ef-neon-yellow);
            color: #050b1a;
        }

        .secret-trigger {
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease;
        }

        .card-custom {
            background: var(--ef-card);
            border: 1px solid var(--ef-border);
            border-radius: 14px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            margin-bottom: 25px;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .card-header-custom {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--ef-border);
            color: var(--ef-neon-yellow);
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .table-custom {
            color: var(--ef-text);
            margin-bottom: 0;
        }
        .table-custom tbody tr:hover {
            background-color: var(--ef-table-hover);
        }
        .table-custom th {
            color: var(--ef-text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--ef-border);
        }
        .table-custom td {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 14px 10px;
        }

        .clickable-player {
            color: var(--ef-text);
            cursor: pointer;
            font-weight: 700;
            transition: color 0.2s;
        }
        .clickable-player:hover {
            color: var(--ef-neon-pink);
            text-decoration: underline;
        }

        .fixture-row {
            padding: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fixture-team { width: 38%; font-weight: 600; }
        .fixture-score {
            width: 24%;
            text-align: center;
            font-weight: 900;
            color: var(--ef-neon-yellow);
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
            padding: 6px 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .admin-input {
            width: 45px;
            background: #050b1a !important;
            border: 1px solid var(--ef-neon-pink) !important;
            color: var(--ef-neon-yellow) !important;
            font-weight: bold;
            text-align: center;
            padding: 2px;
            border-radius: 4px;
        }
        
        .modal-content-custom {
            background: #0a142c;
            border: 2px solid var(--ef-neon-yellow);
            color: white;
        }
        .history-win { color: #00dfa2; font-weight: 900; }
        .history-loss { color: var(--ef-neon-pink); font-weight: 900; }
        .history-draw { color: #94a3b8; font-weight: 900; }
        .admin-badge {
            background: var(--ef-neon-pink);
            color: white;
            font-size: 0.75rem;
            padding: 3px 9px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="header-banner">
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">☀️ Light Mode</button>
    <h1 class="league-title mb-1">🎮 eLite Division League 🎮</h1>
    <p class="text-white-50 fw-bold text-uppercase tracking-wider mb-0 secret-trigger" id="subBanner">Season 6 Official Tournament Hub</p>
</div>

<div class="container pb-5">
    <div id="admin-panel-header" class="card card-custom d-none p-3 border-danger bg-dark">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <span class="admin-badge me-2">Admin Mode Active</span>
                <span class="text-white-50">You can now input scores directly inside the fixture rows.</span>
            </div>
            <div>
                <button class="btn btn-sm btn-outline-warning me-2" onclick="exportDataCode()">Export Code Array</button>
                <button class="btn btn-sm btn-danger" onclick="logoutAdmin()">Exit Admin</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-xl-7 col-lg-12">
            <div class="card card-custom">
                <div class="card-header card-header-custom d-flex justify-content-between align-items-center">
                    <span>📊 Live Standings</span>
                    <small class="text-muted text-lowercase">Click any player to view history</small>
                </div>
                <div class="table-responsive">
                    <table class="table table-custom align-middle text-center">
                        <thead>
                            <tr>
                                <th width="8%">Pos</th>
                                <th class="text-start" width="32%">Player Name</th>
                                <th width="10%">P</th>
                                <th width="10%">W</th>
                                <th width="10%">D</th>
                                <th width="10%">L</th>
                                <th width="10%">GD</th>
                                <th width="10%" style="color: var(--ef-neon-yellow);">Pts</th>
                            </tr>
                        </thead>
                        <tbody id="standings-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-xl-5 col-lg-12">
            <div class="card card-custom">
                <div class="card-header card-header-custom d-flex justify-content-between align-items-center">
                    <span>📅 Schedule & Fixtures</span>
                    <select id="matchday-select" class="form-select form-select-sm bg-dark text-info border-secondary" style="width: 130px;" onchange="renderFixtures()">
                        </select>
                </div>
                <div class="card-body p-0" id="fixtures-container">
                    </div>
                <div class="card-footer d-none bg-dark text-end border-top border-secondary" id="admin-save-footer">
                    <button class="btn btn-sm btn-success px-4" onclick="saveAdminScores()">Save Matchday Scores</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content modal-content-custom">
            <div class="modal-header border-secondary">
                <h6 class="modal-title text-warning">🔒 Secure Admin Portal</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label font-monospace text-white-50 small">Enter Key Code</label>
                    <input type="password" id="adminPasswordInput" class="form-control bg-dark text-white border-secondary">
                </div>
                <button class="btn btn-primary w-100 fw-bold" onclick="attemptLogin()">Unlock System</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="historyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-custom">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="modalPlayerName">Player History</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0" id="modalHistoryContainer">
                </div>
        </div>
    </div>
</div>

<div class="modal fade" id="exportModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content modal-content-custom">
            <div class="modal-header border-secondary">
                <h5 class="modal-title text-info">📋 Export Data Code</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <textarea id="exportTextArea" class="form-control bg-dark text-warning font-monospace small" rows="12" readonly onclick="this.select()"></textarea>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ==================== CONFIGURATION DATABASE AREA ====================
const ADMIN_KEY = "edn2026"; 
const MAX_VISIBLE_MATCHDAY = 9; 

// Simply swap these default values out with real registrations when slots fill up!
const players = {
    1: { name: "Player 1", stats: {} },
    2: { name: "Player 2", stats: {} },
    3: { name: "Player 3", stats: {} },
    4: { name: "Player 4", stats: {} },
    5: { name: "Player 5", stats: {} },
    6: { name: "Player 6", stats: {} },
    7: { name: "Player 7", stats: {} },
    8: { name: "Player 8", stats: {} },
    9: { name: "Player 9", stats: {} },
    10: { name: "Player 10", stats: {} }
};

const defaultFixtures = [
    { matchday: 1, home: 1, away: 10, homeScore: null, awayScore: null },
    { matchday: 1, home: 2, away: 9, homeScore: null, awayScore: null },
    { matchday: 1, home: 3, away: 8, homeScore: null, awayScore: null },
    { matchday: 1, home: 4, away: 7, homeScore: null, awayScore: null },
    { matchday: 1, home: 5, away: 6, homeScore: null, awayScore: null },

    { matchday: 2, home: 1, away: 9, homeScore: null, awayScore: null },
    { matchday: 2, home: 10, away: 8, homeScore: null, awayScore: null },
    { matchday: 2, home: 2, away: 7, homeScore: null, awayScore: null },
    { matchday: 2, home: 3, away: 6, homeScore: null, awayScore: null },
    { matchday: 2, home: 4, away: 5, homeScore: null, awayScore: null },

    { matchday: 3, home: 1, away: 8, homeScore: null, awayScore: null },
    { matchday: 3, home: 9, away: 7, homeScore: null, awayScore: null },
    { matchday: 3, home: 10, away: 6, homeScore: null, awayScore: null },
    { matchday: 3, home: 2, away: 5, homeScore: null, awayScore: null },
    { matchday: 3, home: 3, away: 4, homeScore: null, awayScore: null },

    { matchday: 4, home: 1, away: 7, homeScore: null, awayScore: null },
    { matchday: 4, home: 8, away: 6, homeScore: null, awayScore: null },
    { matchday: 4, home: 9, away: 5, homeScore: null, awayScore: null },
    { matchday: 4, home: 10, away: 4, homeScore: null, awayScore: null },
    { matchday: 4, home: 2, away: 3, homeScore: null, awayScore: null },

    { matchday: 5, home: 1, away: 6, homeScore: null, awayScore: null },
    { matchday: 5, home: 7, away: 5, homeScore: null, awayScore: null },
    { matchday: 5, home: 8, away: 4, homeScore: null, awayScore: null },
    { matchday: 5, home: 9, away: 3, homeScore: null, awayScore: null },
    { matchday: 5, home: 10, away: 2, homeScore: null, awayScore: null },

    { matchday: 6, home: 1, away: 5, homeScore: null, awayScore: null },
    { matchday: 6, home: 6, away: 4, homeScore: null, awayScore: null },
    { matchday: 6, home: 7, away: 3, homeScore: null, awayScore: null },
    { matchday: 6, home: 8, away: 2, homeScore: null, awayScore: null },
    { matchday: 6, home: 9, away: 10, homeScore: null, awayScore: null },

    { matchday: 7, home: 1, away: 4, homeScore: null, awayScore: null },
    { matchday: 7, home: 5, away: 3, homeScore: null, awayScore: null },
    { matchday: 7, home: 6, away: 2, homeScore: null, awayScore: null },
    { matchday: 7, home: 7, away: 10, homeScore: null, awayScore: null },
    { matchday: 7, home: 8, away: 9, homeScore: null, awayScore: null },

    { matchday: 8, home: 1, away: 3, homeScore: null, awayScore: null },
    { matchday: 8, home: 4, away: 2, homeScore: null, awayScore: null },
    { matchday: 8, home: 5, away: 10, homeScore: null, awayScore: null },
    { matchday: 8, home: 6, away: 9, homeScore: null, awayScore: null },
    { matchday: 8, home: 7, away: 8, homeScore: null, awayScore: null },

    { matchday: 9, home: 1, away: 2, homeScore: null, awayScore: null },
    { matchday: 9, home: 3, away: 10, homeScore: null, awayScore: null },
    { matchday: 9, home: 4, away: 9, homeScore: null, awayScore: null },
    { matchday: 9, home: 5, away: 8, homeScore: null, awayScore: null },
    { matchday: 9, home: 6, away: 7, homeScore: null, awayScore: null }
];

let fixtures = JSON.parse(localStorage.getItem('dl_s6_fixtures')) || defaultFixtures;
let isAdmin = false;

document.getElementById('subBanner').addEventListener('dblclick', openLoginModal);

function toggleTheme() {
    const html = document.documentElement;
    const btn = document.getElementById('themeBtn');
    if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        btn.innerText = "🌙 Dark Mode";
    } else {
        html.setAttribute('data-theme', 'dark');
        btn.innerText = "☀️ Light Mode";
    }
}

function openLoginModal() {
    document.getElementById('adminPasswordInput').value = '';
    new bootstrap.Modal(document.getElementById('loginModal')).show();
}

function attemptLogin() {
    if (document.getElementById('adminPasswordInput').value === ADMIN_KEY) {
        isAdmin = true;
        bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
        document.getElementById('admin-panel-header').classList.remove('d-none');
        document.getElementById('admin-save-footer').classList.remove('d-none');
        renderFixtures();
    } else {
        alert("Access Denied.");
    }
}

function logoutAdmin() {
    isAdmin = false;
    document.getElementById('admin-panel-header').classList.add('d-none');
    document.getElementById('admin-save-footer').classList.add('d-none');
    renderFixtures();
}

function calculateStandings() {
    for (let id in players) {
        players[id].stats = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
    }
    fixtures.forEach(m => {
        if (m.homeScore !== null && m.awayScore !== null) {
            let h = players[m.home].stats;
            let a = players[m.away].stats;
            h.p++; a.p++;
            h.gf += m.homeScore; h.ga += m.awayScore;
            a.gf += m.awayScore; a.ga += m.homeScore;
            if (m.homeScore > m.awayScore) { h.w++; h.pts += 3; a.l++; }
            else if (m.homeScore < m.awayScore) { a.w++; a.pts += 3; h.l++; }
            else { h.d++; h.pts += 1; a.d++; a.pts += 1; }
            h.gd = h.gf - h.ga; a.gd = a.gf - a.ga;
        }
    });

    let sorted = Object.keys(players).map(id => ({ id: id, ...players[id] }));
    sorted.sort((x, y) => y.stats.pts - x.stats.pts || y.stats.gd - x.stats.gd || y.stats.gf - x.stats.gf);

    const tbody = document.getElementById('standings-body');
    tbody.innerHTML = '';
    sorted.forEach((p, idx) => {
        tbody.innerHTML += `
            <tr>
                <td><strong>${idx + 1}</strong></td>
                <td class="text-start clickable-player" onclick="openPlayerHistory(${p.id})">${p.name}</td>
                <td>${p.stats.p}</td>
                <td>${p.stats.w}</td>
                <td>${p.stats.d}</td>
                <td>${p.stats.l}</td>
                <td>${p.stats.gd > 0 ? '+' + p.stats.gd : p.stats.gd}</td>
                <td style="color: var(--ef-neon-yellow); font-weight: 800;">${p.stats.pts}</td>
            </tr>
        `;
    });
}

function initSelector() {
    const select = document.getElementById('matchday-select');
    select.innerHTML = '';
    for (let i = 1; i <= MAX_VISIBLE_MATCHDAY; i++) {
        select.innerHTML += `<option value="${i}">Matchday ${i}</option>`;
    }
    renderFixtures();
}

function renderFixtures() {
    const selectedMatchday = parseInt(document.getElementById('matchday-select').value) || 1;
    const container = document.getElementById('fixtures-container');
    container.innerHTML = '';

    const currentMatches = fixtures.filter(m => m.matchday === selectedMatchday);
    currentMatches.forEach(m => {
        const homeName = players[m.home].name;
        const awayName = players[m.away].name;
        let scoreDisplay = '';
        
        if (isAdmin) {
            scoreDisplay = `
                <input type="number" min="0" class="admin-input home-in" value="${m.homeScore !== null ? m.homeScore : ''}">
                <span class="mx-2 text-muted">-</span>
                <input type="number" min="0" class="admin-input away-in" value="${m.awayScore !== null ? m.awayScore : ''}">
            `;
        } else {
            scoreDisplay = (m.homeScore !== null) ? `${m.homeScore} - ${m.awayScore}` : "VS";
        }

        container.innerHTML += `
            <div class="fixture-row">
                <span class="fixture-team text-end pe-3">${homeName}</span>
                <span class="fixture-score">${scoreDisplay}</span>
                <span class="fixture-team text-start ps-3">${awayName}</span>
            </div>
        `;
    });
}

function saveAdminScores() {
    const selectedMatchday = parseInt(document.getElementById('matchday-select').value) || 1;
    const rows = document.querySelectorAll('.fixture-row');
    let idx = 0;
    fixtures.forEach(m => {
        if (m.matchday === selectedMatchday) {
            const hVal = rows[idx].querySelector('.home-in').value;
            const aVal = rows[idx].querySelector('.away-in').value;
            m.homeScore = hVal !== '' ? parseInt(hVal) : null;
            m.awayScore = aVal !== '' ? parseInt(aVal) : null;
            idx++;
        }
    });
    localStorage.setItem('dl_s6_fixtures', JSON.stringify(fixtures));
    calculateStandings(); renderFixtures();
    alert("Scores updated successfully!");
}

function openPlayerHistory(playerId) {
    document.getElementById('modalPlayerName').innerText = `${players[playerId].name} - Match History`;
    const container = document.getElementById('modalHistoryContainer');
    container.innerHTML = '';
    const personalMatches = fixtures.filter(m => m.home == playerId || m.away == playerId);
    let hasPlayed = false;

    personalMatches.forEach(m => {
        if (m.homeScore !== null && m.awayScore !== null) {
            hasPlayed = true;
            const isHome = m.home == playerId;
            const oppName = isHome ? players[m.away].name : players[m.home].name;
            const myS = isHome ? m.homeScore : m.awayScore;
            const oppS = isHome ? m.awayScore : m.homeScore;
            let resClass = "history-draw", resTxt = "D";
            if (myS > oppS) { resClass = "history-win"; resTxt = "W"; }
            else if (myS < oppS) { resClass = "history-loss"; resTxt = "L"; }

            container.innerHTML += `
                <div class="fixture-row border-secondary px-3">
                    <span style="width: 15%;" class="${resClass}">[${resTxt}]</span>
                    <span style="width: 55%;" class="text-white-50">vs ${oppName}</span>
                    <span style="width: 30%; font-weight: bold;" class="text-end text-warning">${myS} - ${oppS}</span>
                </div>
            `;
        }
    });
    if (!hasPlayed) container.innerHTML = `<div class="p-4 text-center text-muted">No matches documented.</div>`;
    new bootstrap.Modal(document.getElementById('historyModal')).show();
}

function exportDataCode() {
    document.getElementById('exportTextArea').value = `const defaultFixtures = ${JSON.stringify(fixtures, null, 4)};`;
    new bootstrap.Modal(document.getElementById('exportModal')).show();
}

window.onload = function() { calculateStandings(); initSelector(); };
</script>
</body>
</html>
